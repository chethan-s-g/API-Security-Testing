name: DevSecOps

on:
  workflow_dispatch:
    inputs:
      runSecurity:
        description: 'Run ZAP active-scan (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Repo
        uses: actions/checkout@v4

      - name: Checkout API Repo
        uses: actions/checkout@v4
        with:
          repository: chethan-s-g/sample-apis
          path: sample-apis

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Start ZAP (optional)
      - name: Start ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          docker run -d \
            -p 8080:8080 \
            --name zap \
            owasp/zap2docker-stable \
            zap.sh -daemon -port 8080 -host 0.0.0.0 -config api.disablekey=true
          sleep 20

      # ✅ Build + Start API
      - name: Build and Start API
        run: |
          cd sample-apis
          mvn -B -DskipTests clean package

          nohup java -jar target/user-api-1.0.jar > api.log 2>&1 &

          for i in {1..20}; do
            sleep 5
            if curl -s http://localhost:8081/api/users > /dev/null; then
              echo "✅ API Started"
              break
            fi
          done

          cat api.log

      - name: Verify API
        run: curl --fail http://localhost:8081/api/users

      # ✅ Toggle ZAP
      - name: Set zapEnabled
        run: |
          if [ "${{ github.event.inputs.runSecurity }}" = "true" ]; then
            sed -i 's|value="false"|value="true"|' testng.xml || true
          else
            sed -i 's|value="true"|value="false"|' testng.xml || true
          fi

      # ✅ Run Tests
      - name: Run Tests
        run: mvn -B clean test

      # ✅ Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: mvn -B allure:report

      # ✅ Merge ZAP into Allure
      - name: Merge ZAP Report
        if: ${{ github.event.inputs.runSecurity == 'true' && always() }}
        run: |
          mkdir -p target/site/allure-maven-plugin/zap
          cp zap-report.html target/site/allure-maven-plugin/zap/index.html

      # ✅ Upload Allure (ONLY ONCE like your working file)
      - name: Upload Report to Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: target/site/allure-maven-plugin

      # ✅ Stop ZAP
      - name: Stop ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: docker stop zap

  deploy:
    runs-on: ubuntu-latest
    needs: api-tests

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4