name: DevSecOps

on:
  workflow_dispatch:
    inputs:
      runSecurity:
        description: 'Run ZAP active-scan (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Repo
        uses: actions/checkout@v4

      - name: Checkout API Repo
        uses: actions/checkout@v4
        with:
          repository: chethan-s-g/sample-apis
          path: sample-apis

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Start ZAP
      - name: Start ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          docker run -d \
            -p 8080:8080 \
            --name zap \
            owasp/zap2docker-stable \
            zap.sh -daemon -port 8080 -host 0.0.0.0 -config api.disablekey=true
          sleep 20

      # ✅ Build API
      - name: Build and Start API
        run: |
          cd sample-apis
          mvn -B -DskipTests clean package

          nohup java -jar target/user-api-1.0.jar > api.log 2>&1 &

          for i in {1..20}; do
            sleep 5
            if curl -s http://localhost:8081/api/users > /dev/null; then
              echo "✅ API Started"
              break
            fi
          done

      - name: Verify API
        run: curl --fail http://localhost:8081/api/users

      # ✅ Toggle ZAP
      - name: Set zapEnabled
        run: |
          if [ "${{ github.event.inputs.runSecurity }}" = "true" ]; then
            sed -i 's|value="false"|value="true"|' testng.xml || true
          else
            sed -i 's|value="true"|value="false"|' testng.xml || true
          fi

      - name: Run Tests
        run: mvn -B clean test

      # ✅ ✅ IMPORTANT FIX → GENERATE REPORT IN CUSTOM PATH
      - name: Generate Allure Report
        if: always()
        run: |
          mvn -B allure:report \
            -Dallure.results.directory=target/allure-results \
            -Dallure.report.directory=target/allure-report

      # ✅ Merge ZAP into SAME ROOT
      - name: Merge ZAP Report
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          mkdir -p target/allure-report/zap
          cp zap-report.html target/allure-report/zap/index.html || true

      # ✅ ✅ CRITICAL (MATCH YOUR WORKING PIPELINE)
      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: target/allure-report

      - name: Stop ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: docker stop zap

  deploy:
    runs-on: ubuntu-latest
    needs: api-tests

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4