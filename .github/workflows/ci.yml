name: DevSecOps

on:
  workflow_dispatch:
    inputs:
      runSecurity:
        description: 'Run ZAP active-scan (true/false)'
        required: false
        default: 'false'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout test repo
      - uses: actions/checkout@v4

      # ✅ Checkout API repo
      - uses: actions/checkout@v4
        with:
          repository: chethan-s-g/sample-apis
          path: sample-apis

      # ✅ Java setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Start ZAP (only when enabled)
      - name: Start ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          docker run -d \
            -p 8080:8080 \
            --name zap \
            owasp/zap2docker-stable \
            zap.sh -daemon -port 8080 -host 0.0.0.0 -config api.disablekey=true
          sleep 20

      # ✅ Build + Start API (FULL FIX)
      - name: Build and Start API
        run: |
          cd sample-apis
          mvn -B -DskipTests clean package

          echo "Listing target folder:"
          ls -l target

          echo "Starting API..."
          nohup java -jar target/user-api-1.0.jar > api.log 2>&1 &

          echo "Waiting for API..."
          for i in {1..20}; do
            sleep 5
            if curl -s http://localhost:8081/api/users > /dev/null; then
              echo "✅ API Started"
              break
            fi
            echo "Waiting... $i"
          done

          echo "API Logs:"
          cat api.log

      # ✅ Fail fast if API not running
      - name: Verify API
        run: curl --fail http://localhost:8081/api/users

      # ✅ Set TestNG flag
      - name: Set zapEnabled
        run: |
          if [ "${{ github.event.inputs.runSecurity }}" = "true" ]; then
            sed -i 's|value="false"|value="true"|' testng.xml || true
          else
            sed -i 's|value="true"|value="false"|' testng.xml || true
          fi

      # ✅ Run tests
      - name: Run Tests
        run: mvn -B clean test

      # ✅ Upload Allure results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            **/allure-results/**
            **/target/allure-results/**

      # ✅ Upload ZAP report
      - name: Upload ZAP Report
        if: ${{ github.event.inputs.runSecurity == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Stop ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: docker stop zap

  # ✅ GENERATE + MERGE REPORT
  report:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ Download Allure results
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # ✅ Download ZAP (optional)
      - name: Download ZAP report
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: zap

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Generate Allure report
      - name: Generate Allure
        run: |
          mvn -B allure:report \
            -Dallure.results.directory=allure-results \
            -Dallure.report.directory=target/allure-report

      # ✅ Merge ZAP report
      - name: Merge ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          mkdir -p target/allure-report/zap
          cp zap/zap-report.html target/allure-report/zap/index.html

      # ✅ Upload for deploy
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/allure-report

  # ✅ DEPLOY TO PAGES
  deploy:
    needs: report
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4