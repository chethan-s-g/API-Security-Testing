name: DevSecOps

on:
  workflow_dispatch:
    inputs:
      runSecurity:
        description: 'Run ZAP active-scan (true/false)'
        required: false
        default: 'false'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: chethan-s-g/sample-apis
          path: sample-apis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Start ZAP
      - name: Start ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          docker run -d \
            -p 8080:8080 \
            --name zap \
            owasp/zap2docker-stable \
            zap.sh -daemon -port 8080 -host 0.0.0.0 -config api.disablekey=true
          sleep 20

      # ✅ Build + Start API
      - name: Build and Start API
        run: |
          cd sample-apis
          mvn -B -DskipTests clean package

          nohup java -jar target/user-api-1.0.jar > api.log 2>&1 &

          for i in {1..20}; do
            sleep 5
            if curl -s http://localhost:8081/api/users > /dev/null; then
              echo "✅ API Started"
              break
            fi
          done

          cat api.log

      - name: Verify API
        run: curl --fail http://localhost:8081/api/users

      # ✅ Toggle ZAP
      - name: Set zapEnabled
        run: |
          if [ "${{ github.event.inputs.runSecurity }}" = "true" ]; then
            sed -i 's|value="false"|value="true"|' testng.xml || true
          else
            sed -i 's|value="true"|value="false"|' testng.xml || true
          fi

      - name: Run Tests
        run: mvn -B clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            **/allure-results/**
            **/target/allure-results/**

      - name: Upload ZAP Report
        if: ${{ github.event.inputs.runSecurity == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Stop ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: docker stop zap

  report:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Download ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: zap

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Generate Allure
      - name: Generate Allure
        run: |
          mvn -B allure:report \
            -Dallure.results.directory=allure-results \
            -Dallure.report.directory=allure-report

      # ✅ Merge ZAP
      - name: Merge ZAP
        if: ${{ github.event.inputs.runSecurity == 'true' }}
        run: |
          mkdir -p allure-report/zap
          cp zap/zap-report.html allure-report/zap/index.html

      # ✅ Upload final site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: allure-report

  deploy:
    needs: report
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      # ✅ ✅ CRITICAL FIX (put files at root)
      - name: Move files to root
        run: |
          ls -l
          mv allure-report/* . || true
          ls -l

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


      # ✅ FIXED STEP
      - name: Show URL
        run: |
          echo "Report URL:"
          echo "${{ steps.deployment.outputs.page_url }}"